name: Verify current API and client
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-node@v4.4.0
        with:
          node-version: '24.22.1'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: PostgreSQL on Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql
          echo "SITE_FACTORY_PG_BIN=$(pg_config --bindir)" >> "$GITHUB_ENV"
      - name: PostgreSQL on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $pg = Get-ChildItem 'C:/Program Files/PostgreSQL' -Directory | Sort-Object Name -Descending | Select-Object -First 1
          if (-not $pg) { throw 'PostgreSQL toolchain is required' }
          "SITE_FACTORY_PG_BIN=$($pg.FullName)/bin" >> $env:GITHUB_ENV
      - run: node node_modules/playwright/cli.js install --with-deps chromium
        env:
          PLAYWRIGHT_BROWSERS_PATH: '${{ github.workspace }}/.local-state/browsers'
      - name: Allow sandboxed Playwright browsers on Linux
        if: runner.os == 'Linux'
        shell: bash
        run: |
          browser_root="$GITHUB_WORKSPACE/.local-state/browsers"
          sudo tee /etc/apparmor.d/site-factory-ci-browsers > /dev/null <<EOF
          abi <abi/4.0>,
          include <tunables/global>
          profile site-factory-ci-chromium "$browser_root/chromium-*/chrome-linux64/chrome" flags=(unconfined) {
            userns,
          }
          profile site-factory-ci-headless "$browser_root/chromium_headless_shell-*/chrome-headless-shell-linux64/chrome-headless-shell" flags=(unconfined) {
            userns,
          }
          EOF
          sudo apparmor_parser -r /etc/apparmor.d/site-factory-ci-browsers
      - run: npm run verify
        env:
          PLAYWRIGHT_BROWSERS_PATH: '${{ github.workspace }}/.local-state/browsers'
      - run: node scripts/api-install-smoke.mjs
      - run: node scripts/reference-template-smoke.mjs
      - run: python -X utf8 scripts/test/linux-publish.test.py
      - run: node --test apps/client/test/*.test.mjs scripts/test/linux-ssh.test.mjs scripts/test/api-release.test.mjs scripts/test/api-upgrade.test.mjs
      - name: Build Electron client
        if: runner.os == 'Windows'
        run: npm run build:client
      - name: Build Linux API archive
        if: runner.os == 'Linux'
        run: node scripts/package-api.mjs --linux
      - uses: actions/upload-artifact@v4.6.2
        with:
          name: verified-${{ runner.os }}
          path: |
            .local-state/releases/
            .local-state/client-build.json
